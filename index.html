<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Halaman Utama - Pembelajaran Online Anak SD</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    /* Reset dan Gaya Global */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      width: 100%;
      font-family: 'Lato', sans-serif;
      background: linear-gradient(135deg, #1e3a8a 50%, #ffffff);
      color: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    /* Header */
    .header {
      background-color: rgba(15, 23, 42, 0.8); /* Biru gelap dengan efek blur */
      backdrop-filter: blur(10px);
      color: white;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      max-width: 1200px;
      width: 90%;
      border-radius: 8px;
    }

    .logo {
      display: flex;
      align-items: center;
    }

    .logo-img {
      height: 40px;
      margin-right: 10px;
    }

    .nav-bar ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
    }

    .nav-links li {
      margin: 0 15px;
    }

    .nav-links a {
      position: relative;
      display: inline-block;
      text-decoration: none;
      color: #1e40af; /* Teks biru gelap */
      font-weight: bold;
      padding: 6px 12px;
      border-radius: 6px;
      background: #ffffff; /* Latar belakang putih untuk tombol default */
      transition: all 0.4s ease;
      overflow: hidden;
      z-index: 1;
      border: 2px solid #1e40af; /* Border biru gelap */
    }
    
    .nav-links a::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.1); /* Efek transparan halus */
      transform: skewX(-30deg);
      transition: left 0.5s ease;
      z-index: -1;
    }
    
    .nav-links a:hover::before {
      left: 100%;
    }
    
    .nav-links a:hover {
      background: #f0f4f8; /* Latar belakang lebih terang saat hover */
      color: #1e40af; /* Teks biru gelap saat hover */
      box-shadow: 0 6px 12px rgba(37, 99, 235, 0.2); /* Efek bayangan lebih halus */
      transform: scale(1.03); /* Membesar sedikit */
    }
    
    /* Efek saat tombol aktif */
    .nav-links .active {
      background: #ffffff; /* Latar belakang putih untuk tombol yang aktif */
      color: #1e40af; /* Teks biru gelap */
      font-weight: bold; /* Font tetap tebal saat aktif */
      transform: scale(1.05); /* Membesar sedikit saat aktif */
      border: 2px solid #1e40af; /* Border biru gelap tetap ada */
    }
    
    /* Tombol lainnya tetap biru */
    .nav-links a:not(.active) {
      background: #2563eb; /* Tombol lainnya tetap biru */
      color: white; /* Teks tetap putih */
      border: 2px solid #2563eb; /* Border biru tetap */
    }
    
    /* Tombol yang tidak aktif */
    .nav-links a.inactive {
      background: #2563eb; /* Tombol tidak aktif tetap biru */
      color: white;
      border: 2px solid #2563eb; /* Border biru tetap */
    }
   
    /* Konten Utama */
    .hero-content {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 40px;
      width: 90%;
      max-width: 1200px;
    }

    .hero-content img {
      width: 600px;
      height: auto;
      border-radius: 10px;
    }

    .hero-content .text-content {
      text-align: left;
      max-width: 500px;
    }

    .hero-content h2 {
      font-size: 36px;
      margin-bottom: 20px;
      color: #f9fafb;
    }

    .hero-content .description {
      font-size: 16px;
      margin-bottom: 20px;
      color: #d1d5db;
    }

    .btn {
      display: inline-block;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      position: relative;
      transition: all 0.4s ease;
      overflow: hidden;
      z-index: 1;
      border: 2px solid #1e40af; /* Border biru gelap */
      color: #1e40af; /* Teks biru gelap */
      background: white; /* Latar belakang putih */
    }
    
    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.1); /* Efek transparan halus */
      transform: skewX(-30deg);
      transition: left 0.5s ease;
      z-index: -1;
    }
    
    .btn:hover::before {
      left: 100%; /* Efek gradien bergerak saat hover */
    }
    
    .btn:hover {
      background: #f0f4f8; /* Latar belakang terang saat hover */
      color: #1e40af; /* Teks tetap biru gelap */
      box-shadow: 0 6px 12px rgba(37, 99, 235, 0.2); /* Efek bayangan lebih halus */
      transform: scale(1.03); /* Membesar sedikit */
    }
    
    .btn:active {
      background: #2563eb; /* Biru terang saat tombol diklik */
      color: white; /* Teks putih saat klik */
      border: 2px solid #2563eb; /* Border biru terang */
    }
    
    /* Efek saat tombol aktif */
    .btn.active {
      background: #ffffff; /* Latar belakang putih untuk tombol yang aktif */
      color: #1e40af; /* Teks biru gelap */
      font-weight: bold;
      transform: scale(1.05); /* Membesar sedikit saat aktif */
      border: 2px solid #1e40af; /* Border biru gelap */
    }
    

    /* Footer */
    .footer {
      text-align: center;
      padding: 15px;
      background-color: #0f172a;
      color: white;
      font-size: 12px;
      position: absolute;
      bottom: 0;
      width: 100%;
    }

    .footer p {
      margin: 0;
    }

    
  </style>
</head>
<body>
  <header class="header">
    <div class="logo">
      <img src="Kurikulum_Merdeka.png" alt="Logo" class="logo-img">
      <h2 class="logo-text">Pembelajaran Online</h2>
    </div>
    <nav class="nav-bar">
      <ul class="nav-links">
        <li><a href="index.html" class="active">Beranda</a></li>
        <li><a href="materi.html">Materi Pembelajaran</a></li>
        <li><a href="kuis.html">Kuis & Permainan</a></li>
      </ul>
    </nav>
  </header>

  <main class="hero full-screen">
    <div class="hero-content">
      <!-- Teks dalam hero -->
      <div class="text-content">
        <h2>Belajar Jadi Seru!</h2>
        <p class="description">Jelajahi materi pembelajaran, kuis, dan permainan edukatif untuk anak SD.</p>
        <a href="materi.html" class="btn secondary-btn">Mulai Belajar</a>
      </div>
      <!-- Gambar di samping teks -->
      <img src="1.jpg" alt="Belajar jadi seru" />
    </div>
  </main>

  <footer class="footer">
    <p>&copy; 2025 Pembelajaran Online Anak SD. Semua Hak Dilindungi.</p>
  </footer>

</body>
</html>
